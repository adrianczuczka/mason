# Reusable workflow: keep the repo's AI context files true.
#
# Detection is deterministic and free (mason-audit, no LLM). The fix is
# provider-agnostic: pass any agent CLI invocation as `agent-command` — the
# work order is exposed as $MASON_AUDIT_PROMPT and needs no MCP server or
# Mason setup on the target repo. The agent's edits land as a small PR that
# cites the evidence; nothing is ever committed to the audited branch.
# Without an agent-command the job is a pure detector and fails when the
# context files have drifted.
#
# Caller example:
#   permissions: { contents: write, pull-requests: write }
#   jobs:
#     audit:
#       uses: adrianczuczka/mason/.github/workflows/mason-audit.yml@main
#       with:
#         agent-command: >-
#           claude -p "$MASON_AUDIT_PROMPT" --allowedTools "Read,Grep,Glob,Edit"
#       secrets: inherit
#
# Repo setting required: "Allow GitHub Actions to create and approve pull
# requests" (Settings → Actions → General → Workflow permissions), or:
#   gh api -X PUT repos/{owner}/{repo}/actions/permissions/workflow \
#     -f default_workflow_permissions=write -F can_approve_pull_request_reviews=true
#
# Known limitation: PRs created with the default GITHUB_TOKEN do not trigger
# the target repo's own CI on the PR. If you need that, run your agent with a
# PAT-backed gh auth instead.

name: Mason context audit

on:
  workflow_call:
    inputs:
      agent-command:
        description: >-
          Shell command that runs your coding agent on the audit work order
          ($MASON_AUDIT_PROMPT). Empty = detect-only, fail when issues exist.
        type: string
        default: ""
      branch-name:
        description: Head branch for the fix PR. A fixed name keeps runs idempotent.
        type: string
        default: "mason/context-audit"
      pr-title:
        type: string
        default: "docs: fix stale context-file claims"
      base-branch:
        description: Base branch for the PR. Empty = the branch this run is on.
        type: string
        default: ""
      checks:
        description: >-
          Comma-separated subset passed to --checks (e.g.
          "deleted-reference,stale-count,dead-command" for certain-class only).
          Empty = all checks.
        type: string
        default: ""
      fetch-depth:
        description: >-
          Checkout depth. The evidence (deleting commits, rename detection,
          doc-vs-manifest ranges) needs history; 0 (full) is the safe default.
        type: number
        default: 0

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      AUDIT_CHECKS: ${{ inputs.checks != '' && format('--checks {0}', inputs.checks) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          ref: ${{ inputs.base-branch != '' && inputs.base-branch || (github.head_ref || github.ref_name) }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit context files
        id: audit
        run: |
          set +e
          npx -y -p mason-context mason-audit --dir . $AUDIT_CHECKS
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then exit 2; fi
          echo "issues=$([ "$code" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Snapshot the evidence BEFORE the fix — by construction the issues
          # are gone afterwards, and the PR body must cite what was found.
          npx -y -p mason-context mason-audit --dir . --json $AUDIT_CHECKS > "$RUNNER_TEMP/audit.json" || true

      - name: Skip when an audit PR is already open
        id: gate
        if: steps.audit.outputs.issues == 'true' && inputs.agent-command != ''
        run: |
          open=$(gh pr list --head "${{ inputs.branch-name }}" --state open --json number --jq length)
          if [ "$open" -gt 0 ]; then
            echo "An audit PR from ${{ inputs.branch-name }} is already open — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the original repair evidence
        if: steps.audit.outputs.issues == 'true' && steps.gate.outputs.skip == 'false' && inputs.agent-command != ''
        run: |
          set +e
          npx -y -p mason-context mason-audit --dir . --prepare-repair --json $AUDIT_CHECKS > "$RUNNER_TEMP/repair.json"
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          baseline=$(jq -er '.baselinePath' "$RUNNER_TEMP/repair.json")
          echo "MASON_REPAIR_BASELINE=$baseline" >> "$GITHUB_ENV"
          jq '.report' "$RUNNER_TEMP/repair.json" > "$RUNNER_TEMP/audit.json"
          # Both verification steps enforce the original issue repairs. Advisory
          # review stays explicitly incomplete and is reported in the PR.
          cat > "$RUNNER_TEMP/verify-mason-repair.sh" <<'VERIFY'
          set -e
          npx -y -p mason-context mason-audit --dir . --verify-repair "$MASON_REPAIR_BASELINE" --json > "$RUNNER_TEMP/verification.json" || true
          jq -e '.action == "verify" and (.diagnostics | length) == 0
            and (.findings | all(.original.confidence == null or .status == "resolved"))
            and (.newFindings | all(.confidence == null))' "$RUNNER_TEMP/verification.json"
          VERIFY

      - name: Fix the flagged claims with the configured agent
        if: steps.audit.outputs.issues == 'true' && steps.gate.outputs.skip == 'false' && inputs.agent-command != ''
        run: |
          export MASON_AUDIT_PROMPT="$(jq -r '.workOrder' "$RUNNER_TEMP/repair.json")"
          export MASON_AUDIT_PROMPT="$MASON_AUDIT_PROMPT
          CI already prepared the baseline and will run verification after your edits and the documentation commit. Edit only the flagged documentation; leave all repair artifacts intact. Report advisories separately."
          ${{ inputs.agent-command }}

      - name: Verify original issues and preserve unresolved advisories
        if: steps.audit.outputs.issues == 'true' && steps.gate.outputs.skip == 'false' && inputs.agent-command != ''
        run: |
          bash "$RUNNER_TEMP/verify-mason-repair.sh"
          # The workflow's own baseline is the only permitted non-doc artifact.
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const allowed = new Set(['CLAUDE.md', '.claude/CLAUDE.md', 'AGENTS.md', process.env.MASON_REPAIR_BASELINE]);
          const changes = execFileSync('git', ['-c', 'status.renames=false', 'status', '--porcelain=v1', '-z', '--untracked-files=all'], {encoding: 'utf8'});
          const extra = changes.split('\0').filter(Boolean).map(line => line.slice(3)).filter(file => !allowed.has(file));
          if (extra.length) { console.error('Agent modified non-doc files:', extra); process.exit(1); }
          NODE

      - name: Open the fix PR
        if: steps.audit.outputs.issues == 'true' && steps.gate.outputs.skip == 'false' && inputs.agent-command != ''
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Agent made no edits — nothing to open a PR for."
            exit 1
          fi
          base="${{ inputs.base-branch != '' && inputs.base-branch || (github.head_ref || github.ref_name) }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "${{ inputs.branch-name }}"
          for doc in CLAUDE.md .claude/CLAUDE.md AGENTS.md; do
            [ -f "$doc" ] && git add "$doc"
          done
          git commit -m "${{ inputs.pr-title }}"
          bash "$RUNNER_TEMP/verify-mason-repair.sh"
          # Safe: this path only runs when no open PR exists for the branch,
          # so a stale branch from a merged/closed PR is fine to overwrite.
          git push -f origin "${{ inputs.branch-name }}"
          {
            echo "The original Mason audit issues are no longer detected after this documentation commit. Review the edits for meaning; advisory review is reported separately below."
            echo ""
            echo "## Resolved by the original checks"
            jq -r '.issues[] | "- **\(.anchor.doc)\(if .anchor.line then ":\(.anchor.line)" else "" end)** – \(.message) _(\(.type), \(.confidence))_"' "$RUNNER_TEMP/audit.json"
            echo ""
            echo "## Remaining review and verification limits"
            jq -r '.status, (.findings[] | select(.status != "resolved") | "- [\(.status)] \(.original.message): \(.reason)"), (.newFindings[] | "- [new] \(.message)"), (.currentAudit.skippedChecks[] | "- [skipped] \(.check): \(.reason)")' "$RUNNER_TEMP/verification.json"
            echo ""
            echo "<details><summary>Full audit report</summary>"
            echo ""
            echo '```json'
            cat "$RUNNER_TEMP/audit.json"
            echo '```'
            echo "</details>"
            echo "<details><summary>Verification against original evidence</summary>"
            echo ""
            echo '```json'
            cat "$RUNNER_TEMP/verification.json"
            echo '```'
            echo "</details>"
          } > "$RUNNER_TEMP/body.md"
          gh pr create \
            --title "${{ inputs.pr-title }}" \
            --body-file "$RUNNER_TEMP/body.md" \
            --head "${{ inputs.branch-name }}" \
            --base "$base"

      - name: Fail when drifted in detect-only mode
        if: steps.audit.outputs.issues == 'true' && inputs.agent-command == ''
        run: |
          echo "Context files have drifted from the code. Pass an agent-command to fix automatically, or run: npx -y -p mason-context mason-audit --dir ."
          exit 1
